name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inject Telegram token
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: '[ -z "$TG_BOT_TOKEN" ] || sed -i "s|__TG_BOT_TOKEN__|${TG_BOT_TOKEN}|g" app/src/main/assets/index.html'

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --build-cache -x lint -x test 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CppUz-Kamola-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Show error in summary
        if: failure()
        run: 'grep -B2 -A30 -E "What went wrong|error:" build.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
