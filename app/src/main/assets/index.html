<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CppUz — Kamola uchun C++</title>
<style>
:root{--bg:#0a0e1a;--s:#111827;--s2:#1a2235;--s3:#1e2d45;--bd:#1e3a5f;--ac:#00e5a0;--ac2:#00b8ff;--rd:#ff6b6b;--yl:#ffd93d;--tx:#e2e8f0;--t2:#94a3b8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--s);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.lg{font-weight:800;font-size:20px;color:var(--ac)}.lg b{color:var(--ac2)}
.pb{flex:1;min-width:140px;height:8px;background:var(--s3);border-radius:8px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
#pt{color:var(--t2);font-size:13px}
.w{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;padding:16px;max-width:1200px;margin:auto}
aside{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:12px;align-self:start}
aside h2{font-size:13px;margin:0 0 8px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}
.li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--t2);border:1px solid transparent}
.li:hover{background:var(--s2)}.li.on{background:var(--s3);color:var(--tx);border-color:var(--ac)}
.li span{width:24px;text-align:center;flex:none}
.card{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 8px;font-size:16px;color:var(--ac2)}
code{background:var(--s3);color:var(--ac);padding:1px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace}
textarea{display:block;position:relative;z-index:1;width:100%;min-height:250px;background:transparent;color:transparent;caret-color:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;font:14px/1.55 ui-monospace,Consolas,monospace;resize:vertical;tab-size:4;outline:0;scrollbar-width:none}textarea::-webkit-scrollbar{display:none}
.ew{position:relative}#hl{position:absolute;inset:0;overflow:hidden;background:#05080f;border:1px solid var(--bd);border-radius:10px;padding:12px;font:14px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-wrap:break-word;color:#d6f5ff;tab-size:4;pointer-events:none}#hl i{font-style:normal}#hl .c,.exb .c{color:#7a8ba3}#hl .k,.exb .k{color:#ff79c6}#hl .s,.exb .s{color:#7ee787}#hl .n,.exb .n{color:#ffa657}#hl .f,.exb .f{color:#00b8ff}
.exw{margin-top:14px;border-top:1px dashed var(--bd);padding-top:10px}.exb{background:#05080f;border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0;font:14px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-x:auto;color:#d6f5ff}.exb i{font-style:normal}
textarea:focus{border-color:var(--ac)}
.bt{background:var(--s3);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer}
.bt:hover{border-color:var(--ac)}.bt.p{background:var(--ac);color:#04120c;border-color:var(--ac);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
pre{margin:0;background:#05080f;border:1px solid var(--bd);border-radius:10px;padding:12px;min-height:80px;white-space:pre-wrap;font:14px/1.5 ui-monospace,Consolas,monospace;color:#9be7ff;overflow-x:auto}
.p{color:var(--ac)}.r{color:#fff}.er{color:var(--rd)}
.q button{display:block;width:100%;text-align:left;margin-top:8px}
.q .ok{border-color:var(--ac);background:rgba(0,229,160,.15)}.q .no{border-color:var(--rd);background:rgba(255,107,107,.15)}
#nx{display:none}
@media(max-width:800px){.w{grid-template-columns:minmax(0,1fr);padding:10px}aside{display:flex;gap:6px;overflow-x:auto}aside h2{display:none}.li{white-space:nowrap}}
/* QORA MUSHUKCHA */
#rb{position:fixed;left:0;top:0;width:128px;z-index:50;touch-action:none;cursor:grab;user-select:none;--ly:0px;--lr:7deg;--es:1;--ps:1}
#rb.hd{cursor:grabbing}@media(max-width:800px){#rb{width:100px}}
.bb{position:absolute;left:50%;bottom:100%;margin-bottom:2px;translate:calc(-50% + var(--bx,0px)) 4px;width:max-content;max-width:min(250px,70vw);padding:9px 12px;border-radius:14px;background:var(--s2);border:1px solid var(--ac);font-size:13px;line-height:1.4;opacity:0;transition:opacity .2s,translate .2s;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.bb.s{opacity:1;translate:calc(-50% + var(--bx,0px)) 0}.bb.dn{bottom:auto;top:100%;margin:2px 0 0}
.cf{transform-origin:50% 92%;animation:br 3.6s ease-in-out infinite}@keyframes br{50%{transform:scaleY(1.03)}}
.wk .cf{animation:wb .36s ease-in-out infinite}@keyframes wb{0%,100%{transform:rotate(-3deg)}25%,75%{transform:translateY(-5px)}50%{transform:rotate(3deg)}}
.cr .cf{animation:none;transform:scale(1.12,.8)}.ar .cf{animation:none;transform:scale(.9,1.14)}
.ld .cf{animation:ld .38s}@keyframes ld{0%{transform:scale(1.2,.72)}60%{transform:scale(.94,1.07)}}
.hd .cf{animation:sw .5s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.lg{transform-box:fill-box;transform-origin:50% 8%}
.wk .l1,.wk .l4{animation:st .36s ease-in-out infinite}.wk .l2,.wk .l3{animation:st .36s ease-in-out infinite .18s}@keyframes st{50%{transform:translateY(-9px)}}
.hd .lg{animation:dg .45s ease-in-out infinite alternate}.hd .l2,.hd .l4{animation-delay:.2s}@keyframes dg{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.ar .lg{transform:translateY(-3px) rotate(7deg)}
[data-m=wave] .l2,[data-m=happy] .l2,[data-m=star] .l2{animation:wv .4s ease-in-out infinite alternate}@keyframes wv{from{transform:rotate(-135deg)}to{transform:rotate(-165deg)}}
[data-m=play] .l1{animation:pl .25s ease-in-out infinite alternate}[data-m=play] .l2{animation:pm .25s ease-in-out infinite alternate .12s}
@keyframes pl{from{transform:rotate(10deg)}to{transform:rotate(150deg)}}@keyframes pm{from{transform:rotate(-10deg)}to{transform:rotate(-150deg)}}
[data-m=groom] .l2{animation:gr .5s ease-in-out infinite alternate}@keyframes gr{from{transform:rotate(-170deg)}to{transform:rotate(-160deg)}}
.pd{opacity:0}[data-m=wave] .pd,[data-m=happy] .pd,[data-m=star] .pd,[data-m=groom] .pd{opacity:1}
.tl{transform-origin:138px 170px;animation:wg 2.4s ease-in-out infinite}@keyframes wg{50%{transform:rotate(12deg)}}
:is([data-m=happy],[data-m=star],[data-m=love],[data-m=wave],[data-m=play]) .tl{animation-duration:.5s}[data-m=grumpy] .tl{animation-duration:.25s}[data-m=sad] .tl,[data-m=cry] .tl{animation:none;transform:rotate(-16deg)}
.el{transform-origin:62px 58px;animation:ta 7s infinite}.er{transform-origin:138px 58px;animation:tb 9s infinite}@keyframes ta{0%,90%,100%{transform:none}94%{transform:rotate(-9deg)}}@keyframes tb{0%,85%,100%{transform:none}90%{transform:rotate(9deg)}}
:is([data-m=sad],[data-m=cry],[data-m=grumpy]) .el{animation:none;transform:rotate(-22deg)}:is([data-m=sad],[data-m=cry],[data-m=grumpy]) .er{animation:none;transform:rotate(22deg)}
.hh{transform-origin:100px 130px;transition:transform .4s}:is([data-m=think],[data-m=curious]) .hh{transform:rotate(-8deg)}[data-m=sleepy] .hh,[data-m=yawn] .hh{transform:translateY(8px) rotate(4deg)}[data-m=sad] .hh{transform:translateY(4px)}
[data-m=sleepy] .cf,[data-m=yawn] .cf{animation:lz 4s ease-in-out infinite}@keyframes lz{0%,100%{transform:scale(1.1,.84)}50%{transform:scale(1.12,.88)}}
[data-m=grumpy] .cf{animation:sh .12s infinite alternate}@keyframes sh{to{transform:translateX(2px)}}
.ee{transform:scale(var(--es));transition:transform .15s}.e2{transform:scale(calc(var(--es)*var(--e2,1)))}
.pp{transform-box:fill-box;transform-origin:center;transform:scale(var(--ps));transition:transform .15s}#rbE{transition:transform .12s}
.ld1,.ld2{transform-box:fill-box;transform-origin:50% 50%;transition:transform .15s}
.ld1{transform:translateY(var(--ly)) rotate(var(--lr))}.ld2{transform:translateY(var(--ly)) rotate(calc(var(--lr)*-1))}
.bk{transform-box:fill-box;transform-origin:center;animation:bk 4.5s infinite}@keyframes bk{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
[data-m=wow] .bk,[data-m=play] .bk{animation:none}
#rb[data-m=wow]{--ly:-18px;--es:1.3;--ps:1.3}#rb[data-m=play]{--ly:-14px;--es:1.15;--ps:1.3;--lr:0deg}#rb[data-m=type]{--ly:-4px;--lr:0deg}
#rb:is([data-m=think],[data-m=curious]){--lr:0deg;--ly:-9px}#rb[data-m=curious]{--e2:1.35}#rb[data-m=sad]{--lr:-14deg;--ly:4px}#rb[data-m=grumpy]{--lr:21deg;--ly:5px}#rb[data-m=groom]{--lr:0deg;--ly:2px}
.ht{position:absolute;left:40%;top:0;pointer-events:none;font-size:20px;animation:fl 1.2s ease-out forwards}@keyframes fl{to{transform:translate(var(--dx),-80px);opacity:0}}
#rb .ac{display:none}
#rb .cf{animation:none!important}
#rb[data-acc="1"] .a1,#rb[data-acc="2"] .a1,#rb[data-acc="3"] .a1,#rb[data-acc="4"] .a1,#rb[data-acc="2"] .a2,#rb[data-acc="3"] .a2,#rb[data-acc="4"] .a2,#rb[data-acc="3"] .a3,#rb[data-acc="4"] .a3,#rb[data-acc="4"] .a4{display:inline}
#rb:is([data-m=cry],[data-m=sleepy],[data-m=yawn],[data-m=love],[data-m=dizzy],[data-m=shy],[data-m=happy],[data-m=wave]) .sg{display:none!important}
.fx{animation:fx 1.8s ease-in-out infinite}.fx2{animation-delay:.9s}@keyframes fx{0%{opacity:0;transform:translateY(8px)}50%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.td{animation:td 1.1s ease-in infinite}@keyframes td{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(24px)}}
.sp{transform-box:fill-box;transform-origin:center;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.cf,.lg,.tl,.bk,.el,.er,.fx,.td,.sp{animation:none!important}}

/* === YANGI HARAKAT ANIMATSIYALARI - 4 OYOQLAB YURISH === */
.wk .l1{animation:walkLeg1 .32s ease-in-out infinite}
.wk .l2{animation:walkLeg2 .32s ease-in-out infinite}
.wk .l3{animation:walkLeg3 .32s ease-in-out infinite}
.wk .l4{animation:walkLeg4 .32s ease-in-out infinite}
@keyframes walkLeg1{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-11px) rotate(12deg)}50%{transform:translateY(-2px) rotate(-4deg)}}
@keyframes walkLeg2{0%,100%{transform:translateY(-2px) rotate(-4deg)}25%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-11px) rotate(-12deg)}75%{transform:translateY(-2px) rotate(4deg)}}
@keyframes walkLeg3{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-10px) rotate(-10deg)}50%{transform:translateY(0) rotate(0deg)}}
@keyframes walkLeg4{0%,100%{transform:translateY(-10px) rotate(10deg)}50%{transform:translateY(0) rotate(0deg)}75%{transform:translateY(-2px) rotate(-4deg)}}
.wk .cf{animation:bodyBob .32s ease-in-out infinite}
@keyframes bodyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wk .tl{animation:tailWalk .32s ease-in-out infinite}
@keyframes tailWalk{0%,100%{transform:rotate(8deg)}50%{transform:rotate(22deg)}}

/* Tepaga tirmashish */
.climb .cf{animation:climbBody .45s ease-in-out infinite}
.climb .l1{animation:climbA .35s ease-in-out infinite}
.climb .l2{animation:climbB .35s ease-in-out infinite .15s}
.climb .l3{animation:climbA .35s ease-in-out infinite .1s}
.climb .l4{animation:climbB .35s ease-in-out infinite .25s}
@keyframes climbBody{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes climbA{0%,100%{transform:translateY(-2px) rotate(-20deg)}50%{transform:translateY(-14px) rotate(25deg)}}
@keyframes climbB{0%,100%{transform:translateY(-14px) rotate(25deg)}50%{transform:translateY(-2px) rotate(-20deg)}}
.climb .tl{animation:climbTail .3s ease-in-out infinite}
@keyframes climbTail{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(15deg)}}

/* Pastga orqamachoq sirpanish */
.slide .cf{transform:rotate(-12deg) scale(.95,1.05);animation:slideWiggle .2s ease-in-out infinite}
@keyframes slideWiggle{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(-8deg)}}
.slide .tl{transform:rotate(35deg)!important;animation:none}

/* Sakrash kuchaygan */
.cr .cf{transform:scale(1.15,.75) translateY(4px)}
.ar .cf{transform:scale(.9,1.2) translateY(-4px)}


/* === BARCHA HARAKATLAR UCHUN CSS === */
.run .cf{animation:runBody .18s ease-in-out infinite}
.run .l1{animation:runLeg1 .18s ease-in-out infinite}
.run .l2{animation:runLeg2 .18s ease-in-out infinite .06s}
.run .l3{animation:runLeg3 .18s ease-in-out infinite .03s}
.run .l4{animation:runLeg4 .18s ease-in-out infinite .09s}
.run .tl{animation:runTail .15s ease-in-out infinite; transform-origin:138px 170px}
@keyframes runBody{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2px) scale(1.02,.98)}}
@keyframes runLeg1{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(20deg)}}
@keyframes runLeg2{0%,100%{transform:translateY(-14px) rotate(20deg)}50%{transform:translateY(0) rotate(-8deg)}}
@keyframes runLeg3{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(15deg)}}
@keyframes runLeg4{0%,100%{transform:translateY(-12px) rotate(15deg)}50%{transform:translateY(0) rotate(-5deg)}}
@keyframes runTail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(15deg)}}

.sneak .cf{transform:scale(1.1,.85) translateY(8px); animation:sneakBody 1.2s ease-in-out infinite}
.sneak .l1,.sneak .l3{animation:sneakLeg .6s ease-in-out infinite}
.sneak .l2,.sneak .l4{animation:sneakLeg .6s ease-in-out infinite .3s}
@keyframes sneakBody{0%,100%{transform:scale(1.1,.85) translateY(8px)}50%{transform:scale(1.12,.82) translateY(9px)}}
@keyframes sneakLeg{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.sit .cf{animation:sitAnim .4s ease-out forwards}
@keyframes sitAnim{to{transform:scale(1.05,.85) translateY(12px)}}
.sit .l1,.sit .l2{transform:translateY(12px) rotate(0deg)}
.sit .l3,.sit .l4{transform:translateY(18px) rotate(15deg) scale(.9)}

.lie .cf{animation:lieAnim .5s ease-out forwards}
@keyframes lieAnim{to{transform:scale(1.3,.6) translateY(22px) rotate(-2deg)}}
.lie .tl{transform:rotate(80deg)!important}

.stretch .cf{animation:stretchAnim 1.2s ease-in-out forwards}
@keyframes stretchAnim{0%{transform:scale(1,1)}30%{transform:scale(1.4,.7) translateY(14px)}70%{transform:scale(.85,1.25) translateY(-8px)}100%{transform:scale(1,1)}}

.scratch .l1{animation:scratchL 0.2s ease-in-out infinite}
.scratch .l2{animation:scratchL 0.2s ease-in-out infinite .1s}
@keyframes scratchL{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(-25deg)}}
.scratch .cf{transform:rotate(8deg)}

.pounce .cf{animation:pouncePrep .25s ease-in forwards, pounceJump .4s ease-out .25s forwards}
@keyframes pouncePrep{to{transform:scale(1.2,.7) translateY(10px)}}
@keyframes pounceJump{0%{transform:scale(1.2,.7) translateY(10px)}50%{transform:scale(.8,1.3) translateY(-20px)}100%{transform:scale(1,1) translateY(0)}}

.knead .l1{animation:kneadA .4s ease-in-out infinite}
.knead .l2{animation:kneadB .4s ease-in-out infinite .2s}
@keyframes kneadA{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-6px) rotate(10deg)}}
@keyframes kneadB{0%,100%{transform:translateY(-6px) rotate(10deg)}50%{transform:translateY(0) rotate(0deg)}}

.celebrate .cf{animation:celebrateSpin .6s ease-in-out infinite}
@keyframes celebrateSpin{0%{transform:rotate(0deg) scale(1)}25%{transform:rotate(12deg) scale(1.15)}50%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(8deg) scale(1.15)}100%{transform:rotate(0deg) scale(1)}}
.celebrate .tl{animation:celebrateTail .2s ease-in-out infinite}
@keyframes celebrateTail{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(30deg)}}

.confused .hh{animation:confusedHead .3s ease-in-out infinite alternate}
@keyframes confusedHead{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}

/* Butterfly & Yarn */
#butterfly{position:fixed;width:28px;height:28px;z-index:60;pointer-events:none;transition:transform .1s;font-size:24px;display:none}
#yarn{position:fixed;width:60px;height:4px;background:linear-gradient(90deg,#ff7ac8,#ffd84d);border-radius:2px;z-index:59;pointer-events:none;display:none;transform-origin:left center}
.confetti{position:fixed;pointer-events:none;z-index:100;font-size:18px;animation:confFall 1.5s ease-out forwards}
@keyframes confFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(300px) rotate(720deg);opacity:0}}


/* Autocomplete */
#acBox{position:absolute;left:12px;bottom:14px;z-index:5;background:var(--s2);border:1px solid var(--ac);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);min-width:180px;max-width:260px;display:none;overflow:hidden}
#acBox.show{display:block}
.acItem{padding:8px 12px;cursor:pointer;font:14px ui-monospace,Consolas,monospace;color:var(--tx);display:flex;justify-content:space-between;gap:8px}
.acItem:hover,.acItem.on{background:var(--s3);color:var(--ac)}
.acItem small{color:var(--t2);font-size:11px}


/* === SOZLAMALAR PANELI - HAMMA NARSANI O'CHIRISH/YOQISH === */
#settingsBtn{position:fixed;right:14px;bottom:14px;z-index:80;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));border:none;color:#000;font-size:26px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#settingsPanel{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:none;overflow-y:auto;padding:20px}
#settingsPanel.open{display:block}
.settingsCard{max-width:520px;margin:20px auto;background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:18px}
.settingsCard h2{margin:0 0 14px;font-size:18px;color:var(--ac)}
.settingRow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--s3);gap:12px}
.settingRow:last-child{border:none}
.switch{position:relative;width:48px;height:28px;background:var(--s3);border-radius:28px;cursor:pointer;transition:.2s;flex:none}
.switch.on{background:var(--ac)}
.switch i{position:absolute;left:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}
.switch.on i{transform:translateX(20px)}
.iconGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.iconOpt{aspect-ratio:1;border:2px solid transparent;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--s2);padding:2px}
.iconOpt.selected{border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,229,160,.3)}
.iconOpt img{width:100%;height:100%;object-fit:cover;border-radius:8px}
#floatingCat{position:fixed;right:16px;top:50%;width:64px;height:64px;z-index:70;border-radius:50%;background:var(--s2);border:2px solid var(--ac);display:none;align-items:center;justify-content:center;font-size:32px;cursor:grab;touch-action:none;box-shadow:0 6px 18px rgba(0,0,0,.4);user-select:none}
#floatingCat.show{display:flex}
#floatingCat img{width:90%;height:90%;border-radius:50%;object-fit:cover}


/* === ULTIMATE PRO MAX - XP, TAMAGOTCHI, SHOP, WIDGET, MASALA BANKI === */
#xpBar{position:fixed;top:0;left:0;right:0;height:4px;background:var(--s3);z-index:100}
#xpBar i{display:block;height:100%;background:linear-gradient(90deg,#ffd93d,#ff6b6b,#00e5a0);width:0;transition:width .5s}
#topStats{display:flex;gap:10px;align-items:center;padding:8px 16px;background:var(--s);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.statChip{background:var(--s2);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
#tamagotchi{position:fixed;right:10px;top:70px;width:90px;z-index:60;background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:8px;text-align:center;display:none}
#tamagotchi.show{display:block}
#tamagotchi .cat{font-size:36px;animation:br 2s infinite}
.tamaBar{height:6px;background:var(--s3);border-radius:4px;overflow:hidden;margin:4px 0}

const L=[
{t:"Salom, dunyo!",th:`<p>Har bir C++ dasturi <code>main()</code> funksiyasidan boshlanadi. Ekranga yozish uchun <code>cout</code>, oqim operatori <code>&lt;&lt;</code> va yangi qator uchun <code>endl</code> ishlatiladi. Har bir buyruq <code>;</code> bilan tugaydi.</p><p><b>Topshiriq:</b> ekranga <code>Salom, dunyo!</code> chiqaring.</p>`,
 s:T('    // Ekranga: Salom, dunyo! chiqaring\n    '),a:T('    cout << "Salom, dunyo!" << endl;'),o:"Salom, dunyo!",r:/cout\s*<</,h:"cout << \"matn\" << endl; ko'rinishida yozing.",
 m:"Salom! Men robot-ustozingizman 🤖 Harakatni boshlang: ekranga cout bilan yozamiz!",q:["Har bir buyruq qaysi belgi bilan tugaydi?",[";",".",":"],0,"C++ da buyruq oxiri nuqtali vergul (;) bilan belgilanadi."]},
{t:"O'zgaruvchilar",th:`<p>O'zgaruvchi — qiymat saqlaydigan quti. Turlari: <code>int</code> (butun), <code>double</code> (kasr), <code>string</code> (matn), <code>bool</code> (ha/yo'q).</p><p>Misol: <code>int yosh = 15;</code></p><p><b>Topshiriq:</b> <code>yosh</code> nomli int o'zgaruvchiga 15 ni yozing va <code>Yosh: 15</code> deb chiqaring.</p>`,
 s:T('    // int yosh = 15; yarating va "Yosh: 15" chiqaring\n    '),a:T('    int yosh = 15;\n    cout << "Yosh: " << yosh << endl;'),o:"Yosh: 15",r:/int\s+\w+\s*=\s*15/,h:"int yosh = 15; deb yozib, cout << \"Yosh: \" << yosh; qiling.",
 ex:T(`    string ism = "Kamola";\n    int sinf = 9;\n    cout << ism << " " << sinf << "-sinfda o'qiydi" << endl;`),exo:"Kamola 9-sinfda o'qiydi",exn:`<p>1) <code>string ism = "Kamola";</code> — matn saqlaydi.<br>2) <code>int sinf = 9;</code> — butun son saqlaydi.<br>3) <code>cout</code> ularni <code>&lt;&lt;</code> bilan ketma-ket chiqaradi. Matn qo'shtirnoq ichida, o'zgaruvchi esa qo'shtirnoqsiz yoziladi.</p>`,
 m:"Endi o'zgaruvchilar! Ularni qiymat saqlaydigan quti deb tasavvur qiling. Harakatni boshlang!",q:["3.14 ni saqlash uchun qaysi tur mos?",["int","double","bool"],1,"Kasr sonlar double yoki float turida saqlanadi."]},
{t:"int bilan hisoblash",th:`<p><code>int</code> — butun sonlar. Amallar: <code>+</code> qo'shish, <code>-</code> ayirish, <code>*</code> ko'paytirish, <code>/</code> bo'lish, <code>%</code> qoldiq. Muhim: butun sonlarni bo'lganda <b>kasr qismi tashlab yuboriladi</b>: 17 / 5 = 3 (3.4 emas), 17 % 5 = 2.</p><p>Amallar tartibi maktabdagidek: avval qavs, keyin <code>* / %</code>, so'ng <code>+ -</code>.</p><p><b>Topshiriq:</b> <code>a</code> va <code>b</code> uchun yig'indi, ayirma, ko'paytma, bo'linma va qoldiqni chiqaring (har biri alohida qatorda): <code>22 12 85 3 2</code>.</p>`,
 s:T(`    int a = 17, b = 5;\n    // a+b, a-b, a*b, a/b, a%b ni chiqaring (har biri alohida qatorda)\n    `),a:T(`    int a = 17, b = 5;\n    cout << a + b << endl;\n    cout << a - b << endl;\n    cout << a * b << endl;\n    cout << a / b << endl;\n    cout << a % b << endl;`),o:"22 12 85 3 2",r:/%/,h:"Beshta cout yozing: a + b, a - b, a * b, a / b va a % b.",
 ex:T(`    int x = 20, y = 6;\n    cout << "Yig'indi: " << x + y << endl;\n    cout << "Bo'linma: " << x / y << endl;\n    cout << "Qoldiq: " << x % y << endl;`),exo:"Yig'indi: 26 Bo'linma: 3 Qoldiq: 2",exn:`<p>20 / 6 = 3,33… lekin <code>int</code> kasrni tashlaydi, shuning uchun <b>3</b> chiqadi. Qoldiq (<code>%</code>) esa 20 - 6·3 = <b>2</b>.</p>`,
 m:"Endi hisoblash vaqti! int bilan to'rt amal va qoldiqni o'rganamiz. Harakatni boshlang!",q:["17 % 5 nimaga teng?",["2","3","3.4"],0,"17 ni 5 ga bo'lsak 3 chiqadi va 2 qoldiq qoladi."]},
{t:"double: kasr sonlar",th:`<p><code>double</code> — kasr sonlar (3.14, 2.5). Agar ikkala son ham <code>int</code> bo'lsa, bo'linma <b>butun</b> chiqadi. Kasr natija kerak bo'lsa, kamida bitta son <code>double</code> bo'lishi kerak: <code>7.0 / 2</code> yoki <code>double x = 7;</code>.</p><p><b>Topshiriq:</b> 7 ni 2 ga to'g'ri (kasr bilan) bo'ling va <code>3.5</code> chiqaring.</p>`,
 s:T(`    int a = 7, b = 2;\n    // int bilan 7 / 2 = 3 chiqadi. Kasr natija uchun nima qilish kerak?\n    `),a:T(`    double x = 7, y = 2;\n    cout << x / y << endl;`),o:"3.5",r:/double|static_cast|\d\.\d/,h:"double x = 7, y = 2; deb e'lon qilib, cout << x / y; yozing.",
 ex:T(`    cout << 9 / 2 << endl;\n    cout << 9.0 / 2 << endl;\n    double r = 10;\n    cout << r / 4 << endl;`),exo:"4 4.5 2.5",exn:`<p><code>9 / 2</code> — ikkalasi ham int, natija <b>4</b>. <code>9.0 / 2</code> — bittasi double, natija <b>4.5</b>. <code>r</code> double bo'lgani uchun <code>r / 4</code> = <b>2.5</b>.</p>`,
 m:"Endi kasr sonlar: double. Bo'lishdagi mashhur tuzoqni birga ko'ramiz!",q:["9 / 2 (ikkalasi int) nimaga teng?",["4.5","4","5"],1,"int / int natijasi butun bo'ladi, kasr tashlanadi."]},
{t:"string: matn bilan ishlash",th:`<p><code>string</code> — matn. Matnlarni <code>+</code> bilan ulash mumkin: <code>"Salom, " + ism</code>. Matn uzunligi: <code>ism.length()</code>. Harfga murojaat: <code>ism[0]</code> (birinchi harf, sanoq 0 dan boshlanadi).</p><p><b>Topshiriq:</b> <code>salom</code> matnini <code>"Salom, "</code>, <code>ism</code> va <code>"!"</code> dan yarating, uni chiqaring, keyin <code>ism</code> uzunligini ham chiqaring: <code>Salom, Kamola! 6</code>.</p>`,
 s:T(`    string ism = "Kamola";\n    // string salom = "Salom, " + ism + "!"; yarating, uni va ism.length() ni chiqaring\n    `),a:T(`    string ism = "Kamola";\n    string salom = "Salom, " + ism + "!";\n    cout << salom << endl;\n    cout << ism.length() << endl;`),o:"Salom, Kamola! 6",r:/length\(\)|size\(\)/,h:"cout << salom << endl; va cout << ism.length() << endl; yozing.",

 m:"Endi matnlar: string. Ularni ulash va uzunligini topishni o'rganamiz. Boshlang!",q:["\"Salom\".length() nimaga teng?",["4","5","6"],1,"Salom so'zida 5 ta harf bor."]},

 m:"Endi matematik funksiyalar: ildiz va daraja. cmath kutubxonasi yordam beradi!",q:["pow(2, 3) nimaga teng?",["6","8","9"],1,"2 ning 3-darajasi: 2·2·2 = 8."]},
{t:"Formulalar va masalalar",th:`<p>Formulalarni kodga o'giramiz. To'g'ri to'rtburchak: yuzi <code>a * b</code>, perimetri <code>2 * (a + b)</code>. Avval o'zgaruvchilar, keyin formula, oxirida <code>cout</code>.</p><p><b>Topshiriq:</b> tomonlari 8 va 5 bo'lgan to'g'ri to'rtburchakning yuzi va perimetrini toping: <code>Yuz: 40</code> va <code>Perimetr: 26</code>.</p>`,
 s:T(`    int a = 8, b = 5;\n    // yuz = a * b, perimetr = 2 * (a + b) ni hisoblab chiqaring\n    `),a:T(`    int a = 8, b = 5;\n    int yuz = a * b;\n    int perimetr = 2 * (a + b);\n    cout << "Yuz: " << yuz << endl;\n    cout << "Perimetr: " << perimetr << endl;`),o:"Yuz: 40 Perimetr: 26",r:/\*/,h:"int yuz = a * b; int perimetr = 2 * (a + b); deb hisoblab, ikkalasini cout bilan chiqaring.",
 ex:T(`    double r = 10, pi = 3.14;\n    double yuz = pi * r * r;\n    cout << "Aylana yuzi: " << yuz << endl;\n    int soat = 135;\n    cout << soat / 60 << " soat " << soat % 60 << " daqiqa" << endl;`),exo:"Aylana yuzi: 314 2 soat 15 daqiqa",exn:`<p>πr² = 3.14 · 10 · 10 = <b>314</b>. 135 daqiqa: 135 / 60 = <b>2</b> soat va 135 % 60 = <b>15</b> daqiqa. <code>/</code> va <code>%</code> bunday masalalarda juda qo'l keladi.</p>`,
 m:"Endi haqiqiy masalalar! Formulani kodga aylantiramiz. Harakatni boshlang!",q:["135 daqiqada nechta to'liq soat bor? (135 / 60, int)",["2","2.25","3"],0,"int bo'lishda kasr tashlanadi: 135 / 60 = 2."]},
{t:"Shart: if / else",th:`<p><code>if (shart) { ... } else { ... }</code> — shart rost bo'lsa birinchi blok, aks holda <code>else</code> bajariladi. Taqqoslash: <code>&gt; &lt; == != &gt;= &lt;=</code>.</p><p><b>Topshiriq:</b> agar <code>a &gt; b</code> bo'lsa, <code>a katta</code> deb chiqaring.</p>`,
 s:T('    int a = 7, b = 3;\n    // Agar a > b bo\'lsa, "a katta" chiqaring\n    '),a:T('    int a = 7, b = 3;\n    if (a > b) {\n        cout << "a katta" << endl;\n    }'),o:"a katta",r:/if\s*\(/,h:"if (a > b) { cout << \"a katta\" << endl; } yozing.",
 m:"Dastur qaror qabul qilishi uchun if kerak. Mantiq vaqti, boshlang!",q:["Shart noto'g'ri bo'lsa qaysi bo'lim ishlaydi?",["if ichi","else","Dastur to'xtaydi"],1,"if noto'g'ri bo'lsa else bo'limi bajariladi."]},
{t:"for tsikli",th:`<p>Tsikl kodni takrorlaydi: <code>for (int i = 1; i &lt;= 5; i++) { ... }</code>. Uch qism: boshlanish, shart, qadam.</p><p><b>Topshiriq:</b> 1 dan 5 gacha raqamlarni probel bilan chiqaring: <code>1 2 3 4 5</code>.</p>`,
 s:T('    // 1 dan 5 gacha: 1 2 3 4 5\n    '),a:T('    for (int i = 1; i <= 5; i++) {\n        cout << i << " ";\n    }\n    cout << endl;'),o:"1 2 3 4 5",r:/for\s*\(/,h:"for ichida cout << i << \" \"; deb yozing.",
 m:"Bir ishni qayta-qayta yozmaymiz, tsikl bizga yordam beradi. Harakatni boshlang!",q:["for (int i=0; i<3; i++) necha marta aylanadi?",["2","3","4"],1,"i = 0, 1, 2 — jami 3 marta."]},

 s:FN.replace('__','    // return ... yozing'),a:FN.replace('__','    return n * n;'),o:"36",r:/return/,h:"Funksiya ichida return n * n; yozing.",

,{t:"while tsikli",th:`<p><code>for</code> da qadamlar soni aniq edi. <code>while</code> da esa shart rost bo'lganda takrorlaydi. Format: <code>while (shart) { ... }</code>. Ehtiyot bo'l: shart hech qachon yolg'on bo'lmasa <b>cheksiz tsikl</b> bo'ladi!</p><p><b>Topshiriq:</b> 1 dan 5 gacha sonlarni <code>while</code> bilan chiqaring: <code>1 2 3 4 5</code></p>`,
 s:T(`    int i = 1;
    // while bilan 1 dan 5 gacha chiqaring
    `),a:T(`    int i = 1;
    while (i <= 5) {
        cout << i << " ";
        i++;
    }
    cout << endl;`),o:"1 2 3 4 5",r:/while/,h:"while (i <= 5) { cout << i << \" \"; i++; } yozing.",
 ex:T(`    int n = 3;
    while (n > 0) {
        cout << n << endl;
        n--;
    }`),exo:"3 2 1",exn:`<p><code>n</code> 3 dan boshlanadi. Har safar ekranga chiqarib, 1 ga kamaytiriladi. <code>n</code> 0 bo'lganda shart <code>n > 0</code> yolg'on bo'lib, tsikl tugaydi.</p>`,
 m:"While tsikli! for dan farqi - qachon to'xtashini shart aytadi. Cheksiz tsikldan ehtiyot bo'ling! 🤖",q:["while qachon to'xtaydi?",["shart yolg'on bo'lganda","3 marta","hech qachon"],0,"while sharti false bo'lganda to'xtaydi, bo'lmasa cheksiz aylanadi."]}

,{t:"do...while va break / continue",th:`<p><code>do...while</code> — avval bajaradi, keyin shartni tekshiradi. Kamida 1 marta ishlaydi. <code>break</code> — tsiklni sindiradi, <code>continue</code> — shu qadamni tashlab, keyingisiga o'tadi.</p><p><b>Topshiriq:</b> 1 dan 10 gacha, lekin 5 ni tashlab o'ting. Natija: <code>1 2 3 4 6 7 8 9 10</code></p>`,
 s:T(`    for (int i = 1; i <= 10; i++) {
        // 5 bo'lsa continue qiling
    }
    `),a:T(`    for (int i = 1; i <= 10; i++) {
        if (i == 5) continue;
        cout << i << " ";
    }
    cout << endl;`),o:"1 2 3 4 6 7 8 9 10",r:/continue/,h:"if (i == 5) continue; deb yozing, 5 ni tashlab o'tadi.",
 ex:T(`    int i = 1;
    do {
        cout << i << " ";
        i++;
    } while (i <= 3);`),exo:"1 2 3",exn:`<p><code>do</code> bloki avval bajariladi, keyin <code>while</code> sharti tekshiriladi. Shuning uchun kamida 1 marta ishlashi kafolatli.</p>`,
 m:"Break - qochish, continue - sakrash! do...while esa avval qiladi, keyin o'ylaydi! ✨",q:["continue nima qiladi?",["tsiklni tugatadi","joriy qadamni tashlab keyingisiga o'tadi","xatolik"],1,"continue joriy iteratsiyani o'tkazib yuboradi, break esa butun tsiklni to'xtatadi."]}

,{t:"Mantiqiy amallar && || !",th:`<p>Murakkab shartlar: <code>&&</code> — VA (ikkala shart rost), <code>||</code> — YOKI (bittasi rost bo'lsa bo'ldi), <code>!</code> — EMAS (teskari).</p><p>Misol: <code>if (yosh >= 13 && yosh <= 19)</code> — o'smir.</p><p><b>Topshiriq:</b> a soni 10 dan katta VA juft bo'lsa "HA" chiqaring. a=12 uchun HA</p>`,
 s:T(`    int a = 12;
    // a > 10 && a % 2 == 0 bo'lsa HA chiqaring
    `),a:T(`    int a = 12;
    if (a > 10 && a % 2 == 0) {
        cout << "HA" << endl;
    }`),o:"HA",r:/&&/,h:"if (a > 10 && a % 2 == 0) { cout << \"HA\"; }",
 ex:T(`    int yosh = 16;
    if (yosh >= 13 && yosh <= 19) {
        cout << "O'smir" << endl;
    }
    if (yosh < 13 || yosh > 19) {
        cout << "O'smir emas" << endl;
    }`),exo:"O'smir",exn:`<p>Birinchi shart: yosh 13 dan katta VA 19 dan kichik — rost. Ikkinchi shart YOKI bilan — yosh 13 dan kichik YOKI 19 dan katta bo'lsa.</p>`,
 m:"&& - ikkalasi ham, || - bittasi bo'lsa bo'ldi, ! - teskarisi! Mantiq o'yini! 🤔",q:["Qaysi amal VA ni bildiradi?",["||","&&","!"],1,"&& - VA, || - YOKI, ! - EMAS"]}

,{t:"switch / case",th:`<p>Ko'p tanlov bo'lganda <code>if else if else</code> uzun bo'lib ketadi. <code>switch</code> qulay: <code>switch (kun) { case 1: ... break; case 2: ... }</code>. <code>break</code> ni unutsang keyingi case ga ham kirib ketadi!</p><p><b>Topshiriq:</b> kun=2 bo'lsa "Seshanba" chiqaring</p>`,
 s:T(`    int kun = 2;
    switch (kun) {
        // case larni yozing
    }
    `),a:T(`    int kun = 2;
    switch (kun) {
        case 1: cout << "Dushanba" << endl; break;
        case 2: cout << "Seshanba" << endl; break;
        case 3: cout << "Chorshanba" << endl; break;
        default: cout << "Boshqa kun" << endl;
    }`),o:"Seshanba",r:/switch/,h:"case 2: cout << \"Seshanba\" << endl; break; yozing",
 ex:T(`    int baho = 5;
    switch (baho) {
        case 5: cout << "A'lo" << endl; break;
        case 4: cout << "Yaxshi" << endl; break;
        default: cout << "Qoniqarsiz" << endl;

,{t:"Massivda qidirish va saralash",th:`<p>Massivda eng ko'p qilinadigan ishlar: yig'indi, eng katta <code>max</code>, eng kichik <code>min</code>, qidirish. Buning uchun <code>for</code> va <code>if</code> yetarli.</p><p><b>Topshiriq:</b> massivda eng kattasini toping. {5, 9, 2, 8} uchun 9 chiqsin</p>`,

,{t:"Ikki o'lchamli massiv (matritsa)",th:`<p>Jadval kabi: <code>int a[2][3] = {{1,2,3},{4,5,6}};</code> — 2 qator, 3 ustun. Murojaat: <code>a[0][1] = 2</code> (0-qator, 1-ustun). Ikki ta <code>for</code> bilan aylaniladi.</p><p><b>Topshiriq:</b> 2x2 matritsa yig'indisini chiqaring: {{1,2},{3,4}} = 10</p>`,

,{t:"Funksiya parametrlari, return turlari",th:`<p>Funksiya parametr oladi va qiymat qaytaradi: <code>int yig(int a, int b) { return a+b; }</code>. <code>void</code> — hech narsa qaytarmaydi. Parametrlar nusxa bo'lib uzatiladi.</p><p><b>Topshiriq:</b> ikki sonning kattasini qaytaradigan <code>max2</code> funksiyasini yozing. max2(5,9)=9</p>`,

,{t:"Rekursiya - o'zini chaqiradigan funksiya",th:`<p>Rekursiya — funksiya o'zini chaqiradi! Ikki ko'zgu bir-biriga qarasa, aks cheksiz takrorlanadi! Har doim to'xtash sharti bo'lishi kerak, bo'lmasa cheksiz!</p><p>Misol: faktorial 5! = 5*4*3*2*1. <code>fact(n) = n * fact(n-1)</code>, <code>fact(1)=1</code>.</p><p><b>Topshiriq:</b> faktorial uchun rekursiv funksiya, fact(4)=24</p>`,
 s:T(`    int fact(int n) {
        if (n <= 1) return 1;
        // rekursiv chaqiruv
    }
    `),a:T(`    int fact(int n) {
        if (n <= 1) return 1;
        return n * fact(n-1);
    }
    `),o:"24",r:/fact\(n-1\)/,h:"return n * fact(n-1);",
 ex:T(`    int sumRec(int n) {
        if (n == 1) return 1;
        return n + sumRec(n-1);
    }
    // sumRec(3) = 3+2+1=6`),exo:"6",exn:`<p>Rekursiya yig'indini hisoblaydi: 3 + sumRec(2), sumRec(2) = 2 + sumRec(1) = 3, jami 6.</p>`,
 m:"Rekursiya - ko'zgular zali! Funksiya o'zini chaqiradi, lekin to'xtash sharti shart! 🪞🤖",q:["Rekursiyada nima bo'lishi shart?",["to'xtash sharti","for","cout"],0,"To'xtash sharti bo'lmasa rekursiya cheksiz bo'lib ketadi va xotira to'lib qoladi."]}

const acBox=document.getElementById('acBox');
let acIndex=0, acList=[], acWord='', acStart=0;

function getCurrentWord(){
  const pos=ed.selectionStart;
  const text=ed.value.slice(0,pos);
  const m=text.match(/([a-zA-Z_#][a-zA-Z0-9_]*)$/);
  if(!m) return null;
  return {word:m[1], start:pos-m[1].length, end:pos};
}

function showAutocomplete(){
  const cw=getCurrentWord();
  if(!cw || cw.word.length<1){ acBox.classList.remove('show'); return; }
  const q=cw.word.toLowerCase();
  acList=CPP_KEYWORDS.filter(o=>o.k.toLowerCase().startsWith(q) && o.k.toLowerCase()!==q).slice(0,8);
  if(acList.length===0){ acBox.classList.remove('show'); return; }
  acWord=cw.word; acStart=cw.start; acIndex=0;
  acBox.innerHTML=acList.map((o,i)=>`<div class="acItem ${i===0?'on':''}" data-i="${i}"><span>${o.k}</span><small>${o.d}</small></div>`).join('');
  acBox.classList.add('show');
}

function hideAutocomplete(){ acBox.classList.remove('show'); }

function applyAutocomplete(i){
  const item=acList[i]; if(!item) return;
  const pos=ed.selectionStart;
  const before=ed.value.slice(0,acStart);
  const after=ed.value.slice(pos);
  const insert=item.t || item.k;
  ed.value=before+insert+after;
  const newPos=acStart+insert.length;
  ed.setSelectionRange(newPos,newPos);
  ed.focus();
  hideAutocomplete();
  // trigger highlight
  if(typeof lv!=='undefined') lv=null;
}

ed.addEventListener('input', ()=>{ showAutocomplete(); });
ed.addEventListener('keydown', (e)=>{
  if(!acBox.classList.contains('show')) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); acIndex=(acIndex+1)%acList.length; acBox.querySelectorAll('.acItem').forEach((el,j)=>el.classList.toggle('on',j===acIndex)); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); acIndex=(acIndex-1+acList.length)%acList.length; acBox.querySelectorAll('.acItem').forEach((el,j)=>el.classList.toggle('on',j===acIndex)); }
  else if(e.key==='Tab' || e.key==='Enter'){ e.preventDefault(); applyAutocomplete(acIndex); }
  else if(e.key==='Escape'){ hideAutocomplete(); }
});
acBox.addEventListener('click', (e)=>{

async function climbTo(T,g){
  air=1; gnd=null;
  const dir = T.x > X+CW()/2 ? 1 : -1;
  setFace(dir);
  rb.classList.add('climb');
  snd('ping');
  const x0=X, y0=Y, x1=T.x-CW()/2, y1=T.y;
  const D = .65 + Math.hypot(x1-x0, y1-y0)/1200;
  const v = (y1-y0 - .5*G*D*D)/D;
  // tirmashish efekti - sekin tepaga
  const ok = await anim(D*1000, t=>{
    const u=Math.min(t/D,1);
    const eased = 1-Math.pow(1-u,2); // easeOut
    X=x0+(x1-x0)*eased;
    Y=y0+v*u*D + .5*G*D*D*u*u*.6;
    // tirmashayotganda titrash
    if(u>.7) Y += Math.sin(u*30)*2;
    put();
  }, g);
  rb.classList.remove('climb');
  if(ok){ X=x1; Y=y1; gnd=T.gnd; endAir(); }
}

async function slideBackDown(g){

    const u=t/600;

let recognition=null;
function toggleVoiceCode(){
  if(!SETTINGS.voiceCode){
    if(recognition) recognition.stop();
    return;
  }
  try{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ say("Ovoz bilan yozish bu telefonda yo'q", 'sad',4000); return; }
    recognition=new SR();
    recognition.lang='en-US';
    recognition.continuous=true;
    recognition.onresult=(e)=>{
      const transcript=e.results[e.results.length-1][0].transcript.toLowerCase();
      let code="";
      if(transcript.includes('cout')) code="cout << ";
      else if(transcript.includes('cin')) code="cin >> ";
      else if(transcript.includes('int')) code="int ";
      else if(transcript.includes('for loop')) code="for (int i=0; i<n; i++) {}";
      else code=transcript;
      const ed=document.getElementById('ed');
      if(ed){ const pos=ed.selectionStart; ed.value=ed.value.slice(0,pos)+code+ed.value.slice(pos); ed.selectionStart=ed.selectionEnd=pos+code.length; ed.focus(); }
    };
    recognition.start();
    say("Ovoz bilan yozish yoqildi! 'cout' deb ayting!",'happy',4000);
  }catch(e){}
}

function feedTama(){
  if(XP_DATA.xp<10){ say("XP yetmadi! Dars qilib XP yig'! 💎", 'sad', 3000); return; }
  XP_DATA.xp-=10;
  XP_DATA.hunger=Math.min(100, XP_DATA.hunger+20);
  XP_DATA.happy=Math.min(100, XP_DATA.happy+10);
  saveXP();
  say("Rahmat, quvvatim to'ldi! 🔋", 'happy', 3000);
  vibrate([50,50,50]);
}

// SHOP - Kiyimlar
const SHOP_ITEMS=[
  {id:'crown', name:'Toj 👑', ico:'👑', price:100, level:3},
  {id:'glasses', name:'Kozoynak 🤓', ico:'🤓', price:50, level:2},
  {id:'tie', name:'Galstuk 👔', ico:'👔', price:80, level:4},
  {id:'cap', name:'Kepka 🧢', ico:'🧢', price:60, level:2},
  {id:'bow', name:'Bantik 🎀', ico:'🎀', price:40, level:1},
  {id:'scarf', name:'Sharf 🧣', ico:'🧣', price:70, level:3},
  {id:'star', name:'Yulduz ⭐', ico:'⭐', price:150, level:5},
  {id:'angel', name:'Farishta 😇', ico:'😇', price:200, level:7},
  {id:'devil', name:'Shayton 😈', ico:'😈', price:200, level:7},
  {id:'wizard', name:'Sehrgar 🧙', ico:'🧙', price:300, level:10},
];

function openShop(){
  document.getElementById('shopModal').classList.add('open');
  renderShop();
}
function closeShop(){ document.getElementById('shopModal').classList.remove('open'); }

function renderShop(){
  const grid=document.getElementById('shopGrid');
  grid.innerHTML=SHOP_ITEMS.map(item=>{
    const owned=XP_DATA.clothes.includes(item.id);
    const canBuy=XP_DATA.xp>=item.price && XP_DATA.level>=item.level;
    const equipped=XP_DATA.equipped===item.id;
    return `<div class="shopItem ${owned?'owned':''}" onclick="buyItem('${item.id}')">
      <div class="ico">${item.ico}</div>
      <div style="font-size:11px;font-weight:700">${item.name}</div>
      <div style="font-size:10px;color:var(--t2)">Lv ${item.level} • ${item.price} XP</div>
      <div style="font-size:10px;color:${owned? (equipped?'var(--ac)':'var(--yl)') : (canBuy?'var(--ac)':'var(--rd)')}">${owned? (equipped?'Kiyilgan ✅':'Sotib olingan') : (canBuy?'Sotib olish':'Qulfli 🔒')}</div>
    </div>`;
  }).join('');
}

function buyItem(id){
  const item=SHOP_ITEMS.find(i=>i.id===id);
  if(!item) return;
  if(XP_DATA.clothes.includes(id)){
    XP_DATA.equipped = XP_DATA.equipped===id ? '' : id;
    saveXP(); renderShop();
    say(`${item.name} ${XP_DATA.equipped===id?'kiyildi!':'yechildi!'} ${item.ico}`, 'happy', 3000);
    // Tamagotchi cat emoji change
    document.getElementById('tamaCat').textContent = XP_DATA.equipped ? item.ico : '🤖';
    document.getElementById('wCat').textContent = XP_DATA.equipped ? item.ico : '🤖';
    return;
  }
  if(XP_DATA.xp<item.price){ say(`XP yetmadi! ${item.price} XP kerak`, 'sad', 3000); return; }
  if(XP_DATA.level<item.level){ say(`Level yetmadi! ${item.level} level kerak`, 'sad', 3000); return; }
  XP_DATA.xp-=item.price;
  XP_DATA.clothes.push(id);
  XP_DATA.equipped=id;
  saveXP(); renderShop();
  say(`${item.name} sotib olindi! Kiyildi! ${item.ico}🎉`, 'star', 4000);
  document.getElementById('tamaCat').textContent=item.ico;
  document.getElementById('wCat').textContent=item.ico;
}

const MASALA_BANK=[
  {id:1, t:"Salom chiqarish", d:"cout bilan Salom", o:"Salom", q:"oson"},
  {id:2, t:"2 son yig'indisi", d:"a=5 b=3 yig'indi 8", o:"8", q:"oson"},
  {id:3, t:"Juftmi?", d:"n juft bo'lsa Juft", o:"Juft", q:"oson"},
  {id:4, t:"Kattasi", d:"2 sondan kattasi", o:"9", q:"oson"},
  {id:5, t:"1 dan N gacha", d:"for bilan 1..5", o:"1 2 3 4 5", q:"oson"},
  {id:6, t:"Faktorial 4", d:"4! = 24", o:"24", q:"ortacha"},
  {id:7, t:"Massiv yig'indi", d:"{1,2,3} yig'indi 6", o:"6", q:"ortacha"},
  {id:8, t:"Eng katta", d:"{5,9,2} max 9", o:"9", q:"ortacha"},
  {id:9, t:"Teskari massiv", d:"{1,2,3} -> 3 2 1", o:"3 2 1", q:"ortacha"},
  {id:10, t:"String uzunlik", d:"\"Kamola\" uzunligi 6", o:"6", q:"oson"},
];
for(let i=11;i<=100;i++){
  MASALA_BANK.push({id:i, t:`Masala ${i}`, d:`C++ masala ${i} - ${['for','if','massiv','string','vector'][i%5]}`, o:`${i}`, q:['oson','ortacha','qiyin'][i%3]});
}

function openMasalaBank(){
  document.getElementById('masalaBank').classList.add('open');
  renderMasala('all');
}
function closeMasalaBank(){ document.getElementById('masalaBank').classList.remove('open'); }

function renderMasala(filter){
  const list=document.getElementById('masalaList');
  const filtered=filter==='all'?MASALA_BANK:MASALA_BANK.filter(m=>m.q===filter);
  list.innerHTML=filtered.slice(0,30).map(m=>{
    const solved=XP_DATA.masalaSolved[m.id];
    return `<div class="problem"><div><b>${m.id}. ${m.t}</b> <small style="color:var(--t2)">(${m.q})</small><br><small>${m.d}</small></div><div><span style="color:${solved?'var(--ac)':'var(--t2)'}">${solved?'✅':'⬜'}</span> <button class="bt" onclick="solveMasala(${m.id})" style="padding:2px 8px;font-size:11px">Yechish</button></div></div>`;
  }).join('');
}

function filterMasala(q){ renderMasala(q); }

function solveMasala(id){
  XP_DATA.masalaSolved[id]=true;
  addXP(10, `masala ${id}`);
  saveXP();
  renderMasala('all');
  say(`Masala ${id} yechildi! +10 XP! 💎`, 'star', 3000);
}

// APP BLOCKER SIMULATSIYA
const BLOCKER_QS=[
  {q:"int a=5; cout << a*2; nima chiqaradi?", a:"10"},
  {q:"for da 0 dan 2 gacha necha marta aylanadi? 0,1,2", a:"3"},
  {q:"cout << 7/2; int bo'lsa nima?", a:"3"},
  {q:"string s=\"hi\"; s.length()?", a:"2"},
  {q:"int a[3]={1,2,3}; a[0]?", a:"1"},
];
let currentBlockerAnswer="10";

function simulateAppBlock(appName){
  if(!SETTINGS.lessonLock) return;
  const q=BLOCKER_QS[Math.floor(Math.random()*BLOCKER_QS.length)];
  currentBlockerAnswer=q.a;
  document.getElementById('blockerQ').textContent=`${appName} qulflangan! Savol: ${q.q}`;
  document.getElementById('appBlocker').classList.add('show');
  logActivity('app_block', `${appName} qulflandi`);
  if(TG_CHAT_ID) sendToTelegram(`🔒 *${appName} qulflandi*\n❓ ${q.q}\n📱 Kamola javob berishi kerak`);
}

function checkBlocker(){
  const ans=document.getElementById('blockerA').value.trim();
  if(ans===currentBlockerAnswer){
    document.getElementById('appBlocker').classList.remove('show');
    document.getElementById('blockerA').value='';
    addXP(5, 'blocker yechdi');
    say("To'g'ri! Qulf ochildi! 🔓", 'happy', 3000);
  } else {
    say("Xato! Yana urin! 🤔", 'sad', 3000);
    vibrate([100,50,100]);
  }
}

function goToLesson(){
  document.getElementById('appBlocker').classList.remove('show');
  window.scrollTo(0,0);
}
