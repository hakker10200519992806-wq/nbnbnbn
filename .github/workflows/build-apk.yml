name: Build APK

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle keshi (keyingi buildlar ancha tez bo'ladi)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Android SDK litsenziyalari
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Inject Telegram token (from GitHub Secret)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ]; then
            sed -i "s|__TG_BOT_TOKEN__|${TG_BOT_TOKEN}|g" 
